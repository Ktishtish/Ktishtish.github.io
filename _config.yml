# Site settings
# These values are used across the whole site. Jekyll does NOT reload this file
# automatically when you run 'bundle exec jekyll serve', so restart the server
# after changing it.
title: Keziah Tisher
email: Keziahtisher@gmail.com
description: >-
  Cybersecurity Enthusiast | Digital Forensics | Data Protection | Information Security
url: "https://ktishtish.github.io"
baseurl: ""
github_username: Ktishtish
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Africa/Nairobi

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Keziah Tisher"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Passionate about ethical hacking, network defense, and digital forensics"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/keziah-tisher/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Ktishtish"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/keziah-tisher/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Ktishtish"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
